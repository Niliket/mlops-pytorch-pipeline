name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements/train.txt
          pip install -r requirements/serve.txt
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Training Image
        run: docker build -f docker/Dockerfile.train -t mlops-train:test .
      - name: Build Serving Image
        run: docker build -f docker/Dockerfile.serve -t mlops-serve:test .
